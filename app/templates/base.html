<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1769d2">
  <meta name="description" content="Семейный квиз на первый день рождения Вани">
  <meta name="csrf-token" content="{{ csrf_token() }}">
  <title>{% block title %}Квиз на день рождения{% endblock %}</title>
  <link rel="icon" href="{{ url_for('static', filename='img/star.svg') }}" type="image/svg+xml">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  {% block head %}{% endblock %}
</head>
<body class="{% block body_class %}{% endblock %}">
  <a class="skip-link" href="#main">К содержанию</a>
  <header class="site-header">
    <a class="wordmark" href="{{ url_for('public.home') }}">
      <span class="wordmark-dot" aria-hidden="true"></span>
      Ванин год!
    </a>
    {% block header_action %}
      <a class="header-link" href="{{ url_for('public.ranking_page') }}">Рейтинг</a>
    {% endblock %}
  </header>
  <main id="main">{% block content %}{% endblock %}</main>
  <footer class="site-footer">
    <span aria-hidden="true">★</span>
    <p>Первый год — большая история</p>
    <span aria-hidden="true">♥</span>
  </footer>
  {% block scripts %}{% endblock %}
</body>
</html>
